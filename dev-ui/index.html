<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Veilguard — dev harness</title>
    <style>
      body { font-family: ui-monospace, monospace; max-width: 820px; margin: 24px auto; padding: 0 16px; }
      .banner { background: #ffe9a8; border: 1px solid #d9b64e; padding: 8px 12px; border-radius: 6px; font-size: 13px; }
      .row { display: flex; gap: 8px; margin: 16px 0; }
      input { flex: 1; padding: 8px; font: inherit; }
      button { padding: 8px 14px; font: inherit; }
      #status { margin: 8px 0; color: #555; }
      #grade { font-size: 28px; font-weight: bold; }
      .counts span { margin-right: 12px; }
      .finding { border: 1px solid #ddd; border-left-width: 5px; padding: 8px 10px; margin: 8px 0; border-radius: 4px; }
      .critical { border-left-color: #c0392f; } .high { border-left-color: #e67e22; }
      .medium { border-left-color: #d4a017; } .low { border-left-color: #2980b9; } .info { border-left-color: #888; }
      .sev { font-size: 11px; text-transform: uppercase; color: #777; }
      .loc { font-size: 12px; color: #888; }
      .locked { background: #f4f4f4; color: #999; padding: 4px 8px; border-radius: 4px; font-size: 12px; display: inline-block; margin-top: 6px; }
    </style>
  </head>
  <body>
    <div class="banner">⚠ Dev harness — <strong>not the product UI</strong>. Proves the free-scan + auth flow end to end.</div>
    <h1>Veilguard free scan</h1>

    <fieldset id="authbox" style="margin:12px 0;padding:10px;border:1px solid #ccc;border-radius:6px;">
      <legend>Account</legend>
      <div id="signedout">
        <div class="row">
          <input id="email" type="email" placeholder="you@example.com" />
          <input id="password" type="password" placeholder="password" />
        </div>
        <div class="row">
          <button id="signup">Sign up</button>
          <button id="login">Log in</button>
          <button id="google">Google</button>
          <button id="github">GitHub</button>
        </div>
      </div>
      <div id="signedin" style="display:none;">
        Signed in as <strong id="who"></strong> (<span id="plan"></span>)
        <button id="logout">Log out</button>
        <div id="myscans" style="margin-top:8px;"></div>
        <div class="row" style="margin-top:8px;">
          <button id="connectGh">Connect GitHub</button>
          <button id="connectSb">Connect Supabase</button>
        </div>
        <div class="row">
          <button id="deep">Run deep scan (GitHub)</button>
          <button id="deepSb">Run deep scan (Supabase)</button>
          <button id="disconnectGh">Disconnect GitHub</button>
          <button id="disconnectSb">Disconnect Supabase</button>
        </div>
        <div id="connections" style="font-size:12px;color:#333;margin-top:6px;"></div>
        <div id="connstatus" style="font-size:12px;color:#555;"></div>
      </div>
    </fieldset>

    <div class="row">
      <input id="url" type="text" placeholder="https://example.com" value="" />
      <button id="scan">Run free scan</button>
    </div>
    <div id="status">idle</div>
    <div id="grade"></div>
    <div class="counts" id="counts"></div>
    <div id="findings"></div>
    <div id="claimbox" style="margin-top:8px;"></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
