<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Veilguard — dev harness</title>
    <style>
      body { font-family: ui-monospace, monospace; max-width: 820px; margin: 24px auto; padding: 0 16px; }
      .banner { background: #ffe9a8; border: 1px solid #d9b64e; padding: 8px 12px; border-radius: 6px; font-size: 13px; }
      .row { display: flex; gap: 8px; margin: 16px 0; }
      input { flex: 1; padding: 8px; font: inherit; }
      button { padding: 8px 14px; font: inherit; }
      #status { margin: 8px 0; color: #555; }
      #grade { font-size: 28px; font-weight: bold; }
      .counts span { margin-right: 12px; }
      .finding { border: 1px solid #ddd; border-left-width: 5px; padding: 8px 10px; margin: 8px 0; border-radius: 4px; }
      .critical { border-left-color: #c0392f; } .high { border-left-color: #e67e22; }
      .medium { border-left-color: #d4a017; } .low { border-left-color: #2980b9; } .info { border-left-color: #888; }
      .sev { font-size: 11px; text-transform: uppercase; color: #777; }
      .loc { font-size: 12px; color: #888; }
      .locked { background: #f4f4f4; color: #999; padding: 4px 8px; border-radius: 4px; font-size: 12px; display: inline-block; margin-top: 6px; }
    </style>
  </head>
  <body>
    <div class="banner">⚠ Dev harness — <strong>not the product UI</strong>. Proves the free-scan flow end to end.</div>
    <h1>Veilguard free scan</h1>
    <div class="row">
      <input id="url" type="text" placeholder="https://example.com" value="" />
      <button id="scan">Run free scan</button>
    </div>
    <div id="status">idle</div>
    <div id="grade"></div>
    <div class="counts" id="counts"></div>
    <div id="findings"></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
